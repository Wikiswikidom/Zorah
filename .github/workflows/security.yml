name: Security CI

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.js"
      - "next.config.*"
      - "proxy.ts"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.js"
      - "next.config.*"
      - "proxy.ts"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify frozen dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit
