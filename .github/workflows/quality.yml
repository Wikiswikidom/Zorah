name: Zorah Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Security source scan
        run: |
          set -euo pipefail
          echo "Checking repository for accidental secrets and unsafe client exposure…"
          if git grep -nE 'SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY)=|sk_(live|test)_[A-Za-z0-9_-]+' -- ':!*.md' ':!.env.example' ':!docs/**'; then
            echo "Potential server secret/payment secret found in tracked source."
            exit 1
          fi
          if git grep -nE 'dangerouslySetInnerHTML|new Function\\(|eval\\(' -- 'app/**' 'components/**' 'lib/**'; then
            echo "Potentially unsafe dynamic code/HTML sink found. Review before release."
            exit 1
          fi
          while IFS= read -r file; do
            if grep -qE "^[[:space:]]*['\"]use client['\"]" "$file" && grep -q "createAdminClient" "$file"; then
              echo "Service-role client imported into a client component: $file"
              exit 1
            fi
          done < <(find app components lib -type f \( -name '*.ts' -o -name '*.tsx' \))

      - name: Dependency audit
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Running npm audit (attempt $attempt/3)…"
            if npm audit --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed; retrying after a short delay…"
              sleep 10
            fi
          done
          exit 1
